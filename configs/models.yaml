# =============================================================================
# ARES AI — Model Roster (Free-only OpenRouter runtime)
# =============================================================================
# All model IDs live here — never hardcoded in agent source files.
#
# The runtime is deliberately restricted:
#   * OpenRouter (free) is the ONLY LLM provider. Any model listed here
#     must be a `:free` OpenRouter endpoint so a paid request is never sent.
#   * `max_price_*` defaults are ZERO for prompt, completion, per-request and
#     per-image. When OpenRouter advertises a model with any non-zero price it
#     is treated as ineligible and the chain fails closed (never trades).
#   * Only the four required LLM agents (market_analyst, quant, risk, news)
#     carry model chains. All other agents are deterministic and intentionally
#     have NO model configuration.
# =============================================================================

defaults:
  timeout_seconds: 30
  max_retries: 2
  rate_limit_rpm: 2
  max_concurrent_pipelines: 1
  circuit_breaker_threshold: 3
  circuit_breaker_reset_seconds: 300
  temperature: 0.1
  max_tokens: 2048
  # Zero price ceilings — never pay for any LLM token.
  max_price_prompt: 0
  max_price_completion: 0
  max_price_request: 0
  max_price_image: 0

agents:
  market_analyst:
    # Strong reasoning, chart pattern recognition, strict JSON output.
    primary: open_router/nvidia/nemotron-3-super-120b-a12b:free
    fallbacks:
      - open_router/google/gemma-4-31b-it:free
      - open_router/openai/gpt-oss-20b:free
    timeout_seconds: 60

  quant:
    # Rigorous math logic, volatility calculations, JSON compliance.
    primary: open_router/nvidia/nemotron-3-super-120b-a12b:free
    fallbacks:
      - open_router/openai/gpt-oss-20b:free
      - open_router/google/gemma-4-31b-it:free
    timeout_seconds: 90

  risk:
    # Strict rule adherence, no hallucinations, flawless JSON output.
    primary: open_router/nvidia/nemotron-3-super-120b-a12b:free
    fallbacks:
      - open_router/openai/gpt-oss-20b:free
      - open_router/google/gemma-4-31b-it:free
    timeout_seconds: 45

  news:
    # Large context windows and strong text sentiment analysis.
    primary: open_router/google/gemma-4-26b-a4b-it:free
    fallbacks:
      - open_router/nvidia/nemotron-nano-9b-v2:free
      - open_router/openai/gpt-oss-20b:free
    timeout_seconds: 45