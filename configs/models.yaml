# =============================================================================
# ARES AI — Model Roster
# =============================================================================
# All model IDs live here — never hardcoded in agent source files.
# Configured exclusively with working free-tier OpenRouter models, matching
# the best model size/capabilities to each agent's purpose.
#
# Last full live validation: 2026-10-21 against the live OpenRouter catalog:
#   https://openrouter.ai/api/v1/models
# `.github/workflows/model-catalog.yml` re-probes the chains weekly; run
# `python scripts/test_free_models.py` after editing to probe them locally.
# `--dry-run` only prints the configured chains; it does not validate them.
# =============================================================================

defaults:
  timeout_seconds: 60
  max_retries: 3
  circuit_breaker_threshold: 3
  circuit_breaker_reset_seconds: 300
  rate_limit_rpm: 4
  # Last-resort free model. AgentModelConfig appends this after every explicit
  # fallback (deduplicated). Validated free, text+image, 200k context.
  universal_fallback: open_router/openrouter/free

agents:
  supervisor:
    # Needs fast, low-latency routing decisions
    primary: open_router/nvidia/nemotron-3.5-lightning:free
    fallbacks:
      - open_router/google/gemma-4-26b-a4b-it:free
      - open_router/nvidia/nemotron-3-super-120b-a12b:free
    timeout_seconds: 30
    max_retries: 3

  coding:
    # Needs excellent code generation capabilities
    primary: open_router/poolside/laguna-s-2.1:free
    fallbacks:
      - open_router/cohere/north-mini-code:free
      - open_router/google/gemma-4-26b-a4b-it:free
    timeout_seconds: 120

  market_analyst:
    # Needs strong reasoning, chart pattern recognition, and strict JSON output
    primary: open_router/nvidia/nemotron-3-ultra-550b-a55b:free
    fallbacks:
      - open_router/nvidia/nemotron-3-super-120b-a12b:free
      - open_router/google/gemma-4-31b-it:free
    timeout_seconds: 60

  quant:
    # Needs rigorous math logic, volatility calculations, and perfect JSON compliance
    primary: open_router/nvidia/nemotron-3-super-120b-a12b:free
    fallbacks:
      - open_router/nvidia/nemotron-3-ultra-550b-a55b:free
      - open_router/xingchen-agi/xing4.0-29b-a4b:free
    timeout_seconds: 90

  risk:
    # Needs strict rule adherence, no hallucinations, and flawless JSON output
    primary: open_router/nvidia/nemotron-3-super-120b-a12b:free
    fallbacks:
      - open_router/google/gemma-4-31b-it:free
      - open_router/google/gemma-4-26b-a4b-it:free
    timeout_seconds: 45

  news:
    # Needs large context windows and strong text sentiment analysis
    primary: open_router/google/gemma-4-26b-a4b-it:free
    fallbacks:
      - open_router/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
      - open_router/google/gemma-4-31b-it:free
    timeout_seconds: 45

  consensus:
    # Consensus is deterministic (no LLM), but needs a config entry
    primary: open_router/google/gemma-4-26b-a4b-it:free
    fallbacks:
      - open_router/openrouter/free
    timeout_seconds: 15

  reflection:
    # Needs strong post-trade reasoning and evaluation capabilities
    primary: open_router/nvidia/nemotron-3-ultra-550b-a55b:free
    fallbacks:
      - open_router/nvidia/nemotron-3-super-120b-a12b:free
      - open_router/xingchen-agi/xing4.0-29b-a4b:free
    timeout_seconds: 60

  journal:
    # Journal is deterministic (no LLM)
    primary: open_router/google/gemma-4-26b-a4b-it:free
    fallbacks:
      - open_router/openrouter/free
    timeout_seconds: 15

  memory:
    # Memory is deterministic (no LLM)
    primary: open_router/google/gemma-4-26b-a4b-it:free
    fallbacks:
      - open_router/openrouter/free
    timeout_seconds: 15

  execution:
    # Execution is deterministic (no LLM)
    primary: open_router/google/gemma-4-26b-a4b-it:free
    fallbacks:
      - open_router/openrouter/free
    timeout_seconds: 15

  vision:
    # Vision (VL) capabilities for chart/image processing. All validated free
    # and image-capable. VisionAgent's built-in rule-based fallback still works
    # without any model.
    primary: open_router/nvidia/nemotron-3.5-super-vl:free
    fallbacks:
      - open_router/minimax/minimax-m3.1-flash:free
      - open_router/google/gemma-4-31b-it:free
      - open_router/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
    timeout_seconds: 30

  fast:
    # Fallback for fast generic tasks
    primary: open_router/nvidia/nemotron-3.5-lightning:free
    fallbacks:
      - open_router/liquid/lfm-2.5-2.6b:free
      - open_router/poolside/laguna-xs-2.1:free
      - open_router/openrouter/free
    timeout_seconds: 15

  chat:
    # Read-only dashboard assistant. Short, grounded replies; no tool calls.
    primary: open_router/google/gemma-4-26b-a4b-it:free
    fallbacks:
      - open_router/nvidia/nemotron-3-super-120b-a12b:free
      - open_router/nvidia/nemotron-3.5-lightning:free
    timeout_seconds: 45
    rpm: 10
    temperature: 0.4
    max_tokens: 1024

  local_chat:
    # Opt-in local OpenAI-compatible server (Strata). The `local/` prefix routes
    # to LOCAL_LLM_BASE_URL; the server receives the bare model id. Kept outside
    # the remote `chat` chain so the free-tier assertion stays honest.
    primary: local/qwen3.6-35b-a3b-ud-q4_k_m
    fallbacks: []
    timeout_seconds: 90
    rpm: 1
    temperature: 0.4
    max_tokens: 1024

  web_collector:
    # Optional browser-use agent. Needs tool calling, so prefer the free
    # auto-router first. The browser-use path uses only this primary and fails
    # closed rather than walking the chain. Never point this at a paid model.
    primary: open_router/openrouter/free
    fallbacks:
      - open_router/nvidia/nemotron-3-super-120b-a12b:free
      - open_router/google/gemma-4-26b-a4b-it:free
    timeout_seconds: 120
    rpm: 4
    temperature: 0.1
