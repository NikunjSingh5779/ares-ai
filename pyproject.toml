[project]
name = "ares-ai"
version = "0.1.0"
description = "ARES AI — Autonomous Research Execution System"
requires-python = ">=3.11"
authors = [{ name = "ARES AI Team" }]

dependencies = [
    # Core API
    "fastapi>=0.138.0",
    "uvicorn[standard]>=0.49.0",
    "python-multipart>=0.0.32",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",

    # Validation
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.0",

    # Agent orchestration
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",

    # Cache & Vector
    "redis>=5.2.0",
    "chromadb>=0.5.0",

    # HTTP & Data
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.0.0",

    # Monitoring
    "prometheus-client>=0.25.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    
    # Trading & Exchange
    "ccxt>=4.0.0",

    # Data Science & Time Series
    "pandas>=2.0.0",
    "statsmodels>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "pytest-httpx>=0.30.0",
    "mypy>=1.11.0",
    "ruff>=0.15.18",
    "pre-commit>=4.6.0",
]

[tool.setuptools.packages.find]
include = ["backend*", "agents*", "database*", "configs*", "backtesting*", "paper_trading*", "live_trading*"]

[tool.coverage.run]
omit = [
    # These 4 exchange connectors require live API credentials for
    # meaningful testing; they are omitted from coverage because
    # the CI test job has no exchange keys.  The 2 stub connectors
    # (zerodha, ibkr) are NOT omitted — they have dedicated tests.
    "live_trading/exchange/binance.py",
    "live_trading/exchange/bybit.py",
    "live_trading/exchange/coinbase.py",
    "live_trading/exchange/kraken.py",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=backend --cov=agents --cov=database --cov=backtesting --cov=paper_trading --cov=live_trading --cov-report=term --cov-report=html --cov-fail-under=78"
filterwarnings = [
    "ignore:.*iscoroutinefunction.*:DeprecationWarning",
    "ignore:.*coroutine 'Connection._cancel'.*:RuntimeWarning"
]

[tool.mypy]
python_version = "3.14"
exclude = [
    "\\.venv",
    "venv",
    "numpy",
]
strict = true
ignore_missing_imports = true
disallow_untyped_defs = false
disable_error_code = [
    "no-untyped-def",
    "no-untyped-call",
    "comparison-overlap",
    "untyped-decorator",
]

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_errors = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "live_trading.exchange.*"
disable_error_code = [
    "no-any-return",
    "unused-ignore",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
