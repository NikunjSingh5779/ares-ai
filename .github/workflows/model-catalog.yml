# =============================================================================
# ARES AI — Scheduled model-catalog validation
# =============================================================================
# The free-only roster shape is checked on every PR by tests. This workflow
# reports every dead or paid model in the configured chains and fails when a
# critical agent has no working primary or fallback.
#
# Requires the OPENROUTER_API_KEY repository secret. Runs weekly and on demand.

name: Model catalog

on:
  schedule:
    # Mondays 06:17 UTC. Avoid the top of the hour, when GitHub is busiest.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    # 43 roster entries at 4 RPM plus up to 30 s per probe. A full run is
    # normally ~11 minutes; the margin covers slow providers and dependency install.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Fail before installing dependencies when the repository is misconfigured.
      - name: Require the OpenRouter credential
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::OPENROUTER_API_KEY is not set. Add it as a repository secret so the scheduled catalog check can probe the roster."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        # The probe needs the base package plus the dev tools; skip the heavy
        # browser/torch extras that only the full test suite uses.
        run: uv sync --locked --dev

      - name: Probe the live roster
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        # Exit 1 only when a critical agent (market_analyst, quant, risk,
        # supervisor) has no working primary or fallback. --quiet-warn-only
        # would always exit 0, so it must not be used here.
        run: uv run python scripts/test_free_models.py
